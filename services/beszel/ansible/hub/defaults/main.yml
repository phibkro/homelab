---
# Upstream multi-platform index and the ARM64 manifest are both immutable.
# The digest is recorded from the upstream container registry release page.
beszel_image: >-
  docker.io/henrygd/beszel:0.18.8@sha256:4c51486968efa0b0a702c1b0967966a2e06fb250b7418f3072d2488faea27c51
beszel_bind_address: "{{ pi_service_bind_address }}"
beszel_data_dir: /var/lib/beszel
beszel_container_user: "1000:1000"
beszel_health_address: "{{ beszel_bind_address }}"
beszel_health_path: /api/health
beszel_healthcheck_command:
  - /beszel
  - health
  - --url
  - "http://127.0.0.1:{{ beszel_bind_port }}"
beszel_user_creation: "true"
beszel_api_url: "http://{{ beszel_health_address }}:{{ beszel_bind_port }}"
beszel_superuser_email: ""
beszel_superuser_password: ""
beszel_oidc_provider_name: oidc
beszel_oidc_client_id: metrics
beszel_oidc_issuer_url: "https://auth.{{ pi_domain }}"
beszel_oidc_discovery_url: "http://{{ authelia_bind_address }}:{{ authelia_port }}"
