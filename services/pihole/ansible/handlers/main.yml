---
- name: Reload systemd after Pi-hole boot ordering changes
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart Pi-hole after local DNS changes
  containers.podman.podman_container:
    name: pihole
    state: started
    force_restart: true
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - not ansible_check_mode
