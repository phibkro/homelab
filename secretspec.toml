[project]
name = "homelab"
revision = "1.0"

[providers]
sops = "sops://secrets/secrets.yaml"

[profiles.workstation.defaults]
providers = ["sops"]

[profiles.workstation]
EXA_API_KEY = { description = "Exa API key for OMP web search", required = true, ref = { item = "exa-api-key" } }

[profiles.wifi.defaults]
providers = ["sops"]

[profiles.wifi]
AKKAR_WPA_PSK = { description = "Akkar Wi-Fi passphrase (encrypted for shared NixOS wireless access)", required = true, ref = { item = "wifi-akkar-psk" } }
