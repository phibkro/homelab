[project]
name = "homelab"
revision = "1.0"

[providers]
workstation_runtime = "sops://secrets/workstation-runtime.yaml"
adelie_runtime = "sops://secrets/adelie-runtime.yaml"
shared_runtime = "sops://secrets/shared-runtime.yaml"
network = "sops://secrets/network.yaml"
operator_tools = "sops://secrets/operator-tools.yaml"

[profiles.workstation.defaults]
providers = ["workstation_runtime"]

[profiles.workstation]
RESTIC_PASSWORD = { description = "Restic repository password", required = true, ref = { item = "restic-password" } }
NTFY_CHANNEL = { description = "Operator infrastructure alert topic", required = true, providers = ["shared_runtime"], ref = { item = "ntfy-channel" } }
NTFY_PUBLISHER_TOKEN = { description = "Local ntfy publisher bearer token", required = true, ref = { item = "ntfy-publisher-token" } }
OIDC_PHOTOS_CLIENT_SECRET = { description = "Immich OIDC client secret", required = true, ref = { item = "oidc-photos-client-secret" } }
PAPERLESS_ADMIN_PASSWORD = { description = "Paperless administrator password", required = true, ref = { item = "paperless-admin-password" } }
NTFY_AGENTS_CHANNEL = { description = "Private agent-attention alert topic", required = true, ref = { item = "ntfy-agents-channel" } }
EXA_API_KEY = { description = "Exa API key for OMP web search", required = true, ref = { item = "exa-api-key" } }
CLOUDFLARED_TUNNEL_CREDENTIALS = { description = "Cloudflared MCP origin tunnel credentials", required = true, ref = { item = "cloudflared-tunnel-credentials" } }
HINDSIGHT_MCP_BEARER_TOKEN = { description = "Hindsight MCP origin bearer token", required = true, ref = { item = "hindsight_mcp_bearer_token" } }
HERDR_PROJECTS_MCP_BEARER_TOKEN = { description = "Herdr projects MCP origin bearer token", required = true, ref = { item = "herdr_projects_mcp_bearer_token" } }
ATTIC_PUSH_TOKEN = { description = "Attic cache push bearer token", required = true, providers = ["shared_runtime"], ref = { item = "attic_push_token" } }
CLOUDFLARE_MCP_API_TOKEN = { description = "Cloudflare API token for MCP and Access control", required = true, providers = ["operator_tools"], ref = { item = "cloudflare_mcp_api_token" } }
GITLAB_INITIAL_ROOT_PASSWORD = { description = "GitLab root account password; applied once when the database is created", required = true, ref = { item = "gitlab-initial-root-password" } }
GITLAB_SECRET_KEY_BASE = { description = "GitLab Rails secret_key_base; never rotate on an instance with data", required = true, ref = { item = "gitlab-secret-key-base" } }
GITLAB_OTP_KEY_BASE = { description = "GitLab Rails otp_key_base; never rotate on an instance with data", required = true, ref = { item = "gitlab-otp-key-base" } }
GITLAB_DB_KEY_BASE = { description = "GitLab Rails db_key_base; never rotate on an instance with data", required = true, ref = { item = "gitlab-db-key-base" } }
GITLAB_OPENID_CONNECT_SIGNING_KEY = { description = "GitLab OpenID Connect RSA signing key (PEM); never rotate on an instance with data", required = true, ref = { item = "gitlab-openid-connect-signing-key" } }
GITLAB_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY = { description = "GitLab Active Record encryption primary key; never rotate on an instance with data", required = true, ref = { item = "gitlab-active-record-encryption-primary-key" } }
GITLAB_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY = { description = "GitLab Active Record deterministic encryption key; never rotate on an instance with data", required = true, ref = { item = "gitlab-active-record-encryption-deterministic-key" } }
GITLAB_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT = { description = "GitLab Active Record key-derivation salt; never rotate on an instance with data", required = true, ref = { item = "gitlab-active-record-encryption-key-derivation-salt" } }
MODEL_GATEWAY_BEARER = { description = "Kwyne gateway inbound bearer; same source as gateway token file", required = true, ref = { item = "kwyne-model-gateway-bearer" } }
KWYNE_AUTH_BROKER_BEARER = { description = "Private broker bearer shared by broker and gateway", required = true, ref = { item = "kwyne-auth-broker-bearer" } }
KWYNE_MODEL_GATEWAY_ACCESS_SERVICE_TOKEN_ID = { description = "Access service-token UUID; policy selector, not client ID", required = true, ref = { item = "kwyne-model-gateway-access-service-token-id" } }
MODEL_GATEWAY_ACCESS_CLIENT_ID = { description = "Lead-created Access service-token client ID", required = true, ref = { item = "kwyne-model-gateway-access-client-id" } }
MODEL_GATEWAY_ACCESS_CLIENT_SECRET = { description = "Lead-created Access service-token client secret", required = true, ref = { item = "kwyne-model-gateway-access-client-secret" } }

[profiles.adelie.defaults]
providers = ["adelie_runtime"]

[profiles.adelie]
RESTIC_PASSWORD = { description = "Restic repository password", required = true, ref = { item = "restic-password" } }
NTFY_CHANNEL = { description = "Operator infrastructure alert topic", required = true, providers = ["shared_runtime"], ref = { item = "ntfy-channel" } }
OIDC_VAULT_CLIENT_SECRET = { description = "Vaultwarden OIDC client secret", required = true, ref = { item = "oidc-vault-client-secret" } }
OIDC_NEWS_CLIENT_SECRET = { description = "Miniflux OIDC client secret", required = true, ref = { item = "oidc-news-client-secret" } }
GRAFANA_SECRET_KEY = { description = "Grafana application secret key", required = true, ref = { item = "grafana-secret-key" } }
MINIFLUX_ADMIN_PASSWORD = { description = "Miniflux bootstrap administrator password", required = true, ref = { item = "miniflux-admin-password" } }
TMDB_TOKEN = { description = "TMDB API token", required = true, ref = { item = "tmdb-token" } }
ATTIC_JWT_ENVIRONMENT = { description = "Attic server JWT environment", required = true, ref = { item = "attic_jwt_environment" } }
ATTIC_CACHE_KEYPAIR = { description = "Attic cache signing keypair", required = true, ref = { item = "attic_cache_keypair" } }
ATTIC_ADMIN_TOKEN = { description = "Attic administrative bearer token", required = true, ref = { item = "attic_admin_token" } }
ATTIC_PUSH_TOKEN = { description = "Attic cache push bearer token", required = true, providers = ["shared_runtime"], ref = { item = "attic_push_token" } }
RESTIC_SSH_KEY = { description = "Adelie private key for the restricted OneTouch SFTP namespace", required = true, ref = { item = "restic-ssh-key" } }

[profiles.wifi.defaults]
providers = ["network"]

[profiles.wifi]
AKKAR_WPA_PSK = { description = "Akkar Wi-Fi passphrase for shared NixOS wireless access", required = true, ref = { item = "wifi-akkar-psk" } }

[scopes.cloudflare-main]
secrets = ["CLOUDFLARE_MCP_API_TOKEN", "HINDSIGHT_MCP_BEARER_TOKEN", "KWYNE_MODEL_GATEWAY_ACCESS_SERVICE_TOKEN_ID"]

[scopes.cloudflare-projects]
secrets = ["CLOUDFLARE_MCP_API_TOKEN", "HERDR_PROJECTS_MCP_BEARER_TOKEN"]

[scopes.cloudflare-projects-relay]
secrets = ["HERDR_PROJECTS_MCP_BEARER_TOKEN"]

[scopes.cloudflare-dev-share]
secrets = ["CLOUDFLARE_MCP_API_TOKEN"]

# One-off cf operations (service-token create/rotate/delete, Worker secrets).
# Only the API token, so creating a secret never requires that secret.
[scopes.cloudflare-admin]
secrets = ["CLOUDFLARE_MCP_API_TOKEN"]

[scopes.hindsight-origin]
secrets = ["HINDSIGHT_MCP_BEARER_TOKEN"]

[scopes.kwyne-worker-gateway]
secrets = ["MODEL_GATEWAY_BEARER", "MODEL_GATEWAY_ACCESS_CLIENT_ID", "MODEL_GATEWAY_ACCESS_CLIENT_SECRET"]
