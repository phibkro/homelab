[project]
name = "homelab"
revision = "1.0"

[providers]
workstation_runtime = "sops://secrets/workstation-runtime.yaml"
network = "sops://secrets/network.yaml"
operator_tools = "sops://secrets/operator-tools.yaml"

[profiles.workstation.defaults]
providers = ["workstation_runtime"]

[profiles.workstation]
RESTIC_PASSWORD = { description = "Restic repository password", required = true, ref = { item = "restic-password" } }
NTFY_CHANNEL = { description = "Operator infrastructure alert topic", required = true, ref = { item = "ntfy-channel" } }
NTFY_PUBLISHER_TOKEN = { description = "Local ntfy publisher bearer token", required = true, ref = { item = "ntfy-publisher-token" } }
OIDC_VAULT_CLIENT_SECRET = { description = "Vaultwarden OIDC client secret", required = true, ref = { item = "oidc-vault-client-secret" } }
OIDC_PHOTOS_CLIENT_SECRET = { description = "Immich OIDC client secret", required = true, ref = { item = "oidc-photos-client-secret" } }
OIDC_NEWS_CLIENT_SECRET = { description = "Miniflux OIDC client secret", required = true, ref = { item = "oidc-news-client-secret" } }
GRAFANA_SECRET_KEY = { description = "Grafana application secret key", required = true, ref = { item = "grafana-secret-key" } }
MINIFLUX_ADMIN_PASSWORD = { description = "Miniflux bootstrap administrator password", required = true, ref = { item = "miniflux-admin-password" } }
PAPERLESS_ADMIN_PASSWORD = { description = "Paperless administrator password", required = true, ref = { item = "paperless-admin-password" } }
NTFY_AGENTS_CHANNEL = { description = "Private agent-attention alert topic", required = true, ref = { item = "ntfy-agents-channel" } }
EXA_API_KEY = { description = "Exa API key for OMP web search", required = true, ref = { item = "exa-api-key" } }
CLOUDFLARED_TUNNEL_CREDENTIALS = { description = "Cloudflared MCP origin tunnel credentials", required = true, ref = { item = "cloudflared-tunnel-credentials" } }
TMDB_TOKEN = { description = "TMDB API token", required = true, ref = { item = "tmdb-token" } }
HINDSIGHT_MCP_BEARER_TOKEN = { description = "Hindsight MCP origin bearer token", required = true, ref = { item = "hindsight_mcp_bearer_token" } }
HERDR_PROJECTS_MCP_BEARER_TOKEN = { description = "Herdr projects MCP origin bearer token", required = true, ref = { item = "herdr_projects_mcp_bearer_token" } }
ATTIC_JWT_ENVIRONMENT = { description = "Attic server JWT environment", required = true, ref = { item = "attic_jwt_environment" } }
ATTIC_CACHE_KEYPAIR = { description = "Attic cache signing keypair", required = true, ref = { item = "attic_cache_keypair" } }
ATTIC_ADMIN_TOKEN = { description = "Attic administrative bearer token", required = true, ref = { item = "attic_admin_token" } }
ATTIC_PUSH_TOKEN = { description = "Attic cache push bearer token", required = true, ref = { item = "attic_push_token" } }
CLOUDFLARE_MCP_API_TOKEN = { description = "Cloudflare API token for MCP and Access control", required = true, providers = ["operator_tools"], ref = { item = "cloudflare_mcp_api_token" } }

[profiles.wifi.defaults]
providers = ["network"]

[profiles.wifi]
AKKAR_WPA_PSK = { description = "Akkar Wi-Fi passphrase for shared NixOS wireless access", required = true, ref = { item = "wifi-akkar-psk" } }

[scopes.cloudflare-main]
secrets = ["CLOUDFLARE_MCP_API_TOKEN", "HINDSIGHT_MCP_BEARER_TOKEN"]

[scopes.cloudflare-projects]
secrets = ["CLOUDFLARE_MCP_API_TOKEN", "HERDR_PROJECTS_MCP_BEARER_TOKEN"]

[scopes.cloudflare-projects-relay]
secrets = ["HERDR_PROJECTS_MCP_BEARER_TOKEN"]

[scopes.cloudflare-dev-share]
secrets = ["CLOUDFLARE_MCP_API_TOKEN"]

[scopes.hindsight-origin]
secrets = ["HINDSIGHT_MCP_BEARER_TOKEN"]
