# sops policy: which age public keys can decrypt which file paths.
#
# Host enrollment:
#   1. Read /etc/ssh/ssh_host_ed25519_key.pub at the physical console or
#      through an existing independently pinned SSH session.
#   2. Record and compare the SSH fingerprint out of band.
#   3. Convert that exact public key with ssh-to-age.
#   4. Add the recipient only to the narrow creation rule for files the host
#      must decrypt.
#   5. Run `sops updatekeys` for those files and inspect recipient metadata.
#
# `ssh-keyscan` can collect a candidate key. It cannot establish host identity
# and must not authorize a SOPS recipient.
# Removing a recipient from current ciphertext does not revoke its access to
# historical ciphertext. Rotate affected credentials when prior access was not
# authorized.

keys:
  - &mac age1nxq07zper943wz4eredgt82e5jghx7d0sfldzqngn2kfdnwyhuhsl3h0r4
  - &workstation age1d893pv2w42vtharqse3e3yd7rpc8nst7mlw2csssy7e9ql3lcd2q7vw4s0
  - &workstation-user age1lezvx39h43ua5r3zlk34fmfs0wqzz7g3ltfmkg9gm350fw7fq5jsrefr78
  - &pi age108jlf67tj7tcdmlrg8h0wpdyvg24pud3k7u4nfa4zyz9meqml5sskcdncr
  - &adelie age1dkv97zyhtmd7rwglypnqguqp48pg4cjwa9sj5zqfyvued7t5jsws9df98e

creation_rules:
  - path_regex: secrets/adelie\.yaml$
    key_groups:
      - age:
          - *mac
          - *workstation
          - *workstation-user
          - *adelie
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *mac
          - *workstation
          - *workstation-user
          - *pi
