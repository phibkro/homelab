modelRoles:
  default: openai-codex/gpt-6-sol:high
  smol: openai-codex/gpt-6-luna:max
  slow: openai-codex/gpt-6-sol:high
  image: openai-codex/gpt-image-1:auto
  web: web/exa:auto
modelProviderOrder:
  - openai-codex
  - anthropic
providers:
  openai-codex:
    codeMode: "on"
cycleOrder:
  - smol
  - default
  - slow
theme:
  dark: dark-catppuccin
  light: light-catppuccin
defaultThinkingLevel: auto
retry:
  fallbackChains:
    web:
      - web/parallel
      - web/perplexity
      - google/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    openai-codex/gpt-6-sol:
      - anthropic/claude-opus-5-5
    anthropic/claude-opus-5-5:
      - openai-codex/gpt-6-sol
    openai-codex/gpt-6-luna:
      - anthropic/claude-sonnet-5
    anthropic/claude-sonnet-5:
      - openai-codex/gpt-6-luna
    openai-codex/gpt-6-astra:
      - anthropic/claude-fable-5-1
    anthropic/claude-fable-5-1:
      - openai-codex/gpt-6-astra
interruptMode: wait
advisor:
  enabled: false
task:
  eager: preferred
  batch: true
  enableEffort: true
  maxConcurrency: 16
  maxRecursionDepth: 2
  maxEffort: max
  isolation:
    apply: true
    enabled: true
    merge: branch
    commits: ai
  agentAdvisor:
    task: "off"
  # No per-subagent request budget: long slices run to completion instead of stopping mid-step
  # and needing a successor (operator decision, 2026-09-26).
  softRequestBudget: 0
  softRequestBudgetNotice: false
bash:
  autoBackground:
    enabled: true
    thresholdMs: 60000
ask:
  notify: "on"
eval:
  py: true
  js: true
  autoBackground:
    enabled: true
debug:
  enabled: true
compaction:
  enabled: true
  midTurnEnabled: true
  autoContinue: true
  methodOrder:
    - snapcompact
    - remote
    - soft
memory:
  backend: mnemopi
secrets:
  enabled: true
startup:
  setupWizard: false
  showSplash: false
dev:
  autoqaConsent: granted
isolation:
  backend: auto
images:
  urls:
    enabled: false
astGrep:
  enabled: true
generate_image:
  enabled: true
github:
  enabled: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
mnemopi:
  scoping: per-project-tagged
  proactiveLinking: true
  enhancedRecall: true
  polyphonicRecall: true
ttsr:
  contextMode: discard
  repeatMode: once
error:
  notify: "on"
display:
  cacheMissMarker: true
extendedContext: true
composer:
  tokenRate: true
  shape: box
tui:
  codexResetFireworks: true
security:
  enabled: true