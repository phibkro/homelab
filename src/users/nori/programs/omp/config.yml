modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-terra:high
  tiny: openai-codex/gpt-5.6-luna:high
  task: openai-codex/gpt-5.6-terra:high
  advisor: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
modelProviderOrder:
  - openai-codex
  - anthropic
providers:
  webSearchOrder:
    - exa
  openai-codex:
    codeMode: "on"
cycleOrder:
  - smol
  - default
  - slow
theme:
  dark: dark-catppuccin
  light: light-catppuccin
defaultThinkingLevel: auto
retry:
  fallbackChains:
    {}
interruptMode: wait
advisor:
  enabled: false
task:
  eager: preferred
  batch: true
  enableEffort: true
  maxConcurrency: 3
  maxRecursionDepth: 2
  maxEffort: max
  isolation:
    apply: false
    enabled: true
  agentAdvisor:
    task: "off"
bash:
  autoBackground:
    enabled: true
    thresholdMs: 60000
ask:
  notify: "on"
eval:
  py: false
  js: true
debug:
  enabled: true
compaction:
  enabled: true
  midTurnEnabled: true
  autoContinue: true
  methodOrder:
    - snapcompact
    - remote
    - soft
memory:
  backend: mnemopi
secrets:
  enabled: true
startup:
  setupWizard: false
  showSplash: false
dev:
  autoqaConsent: granted
isolation:
  backend: auto
images:
  urls:
    enabled: false
astGrep:
  enabled: true
generate_image:
  enabled: true
github:
  enabled: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
mnemopi:
  scoping: per-project-tagged
  proactiveLinking: true
  enhancedRecall: true
  polyphonicRecall: true
ttsr:
  contextMode: discard
  repeatMode: once
error:
  notify: "on"
display:
  cacheMissMarker: true
