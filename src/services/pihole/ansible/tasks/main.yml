---
- name: Remove Pi-hole when it is not selected by the inventory
  containers.podman.podman_container:
    name: pihole
    state: absent
  when:
    - not pihole_enabled | bool
    - podman_available | bool

- name: Validate the explicit Pi-hole listener contract
  ansible.builtin.assert:
    that:
      - pihole_lan_address | length > 0
      - pihole_lan_address not in ['0.0.0.0', '::']
      - pihole_dns_port | int > 0
      - pihole_dns_port | int < 65536
      - pihole_tailnet_address == '' or pihole_tailnet_address not in ['0.0.0.0', '::']
      - pihole_tailnet_address == '' or pihole_tailnet_address != pihole_lan_address
    fail_msg: >-
      Pi-hole DNS requires concrete LAN and optional tailnet addresses plus a
      valid DNS port; wildcard bindings are not allowed.
  when: pihole_enabled | bool
- name: Validate the Pi-hole adlist contract
  ansible.builtin.assert:
    that:
      - pihole_adlists | length > 0
      - pihole_adlists | map(attribute='address') | unique | length == pihole_adlists | length
      - item.address is match('^https://')
      - item.comment | length > 0
    fail_msg: Pi-hole adlists require unique HTTPS addresses and non-empty comments.
  loop: "{{ pihole_adlists }}"
  loop_control:
    label: "{{ item.address }}"
  when: pihole_enabled | bool
- name: Create the Pi-hole application directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /opt/pihole
      mode: "0750"
    - path: /opt/pihole/dnsmasq.d
      mode: "0755"
  when: pihole_enabled | bool

- name: Ensure Podman restart waits for the Tailscale interface
  ansible.builtin.file:
    path: /etc/systemd/system/podman-restart.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - pihole_tailnet_address | length > 0

- name: Configure boot ordering for the tailnet DNS publication
  ansible.builtin.template:
    src: podman-restart-pihole.conf.j2
    dest: /etc/systemd/system/podman-restart.service.d/10-pihole-tailscale.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd after Pi-hole boot ordering changes
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - pihole_tailnet_address | length > 0

- name: Remove tailnet boot ordering when no tailnet listener is configured
  ansible.builtin.file:
    path: /etc/systemd/system/podman-restart.service.d/10-pihole-tailscale.conf
    state: absent
  notify: Reload systemd after Pi-hole boot ordering changes
  when:
    - not pihole_enabled | bool or pihole_tailnet_address | length == 0

- name: Wait for the declared Tailscale DNS address
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - addr
      - show
      - dev
      - "{{ pi_tailnet_interface }}"
  register: pihole_tailnet_interface
  changed_when: false
  retries: "{{ pihole_tailnet_ready_retries }}"
  delay: "{{ pihole_tailnet_ready_delay }}"
  until:
    - pihole_tailnet_interface.rc == 0
    - pihole_tailnet_address ~ '/' in pihole_tailnet_interface.stdout
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - pihole_tailnet_address | length > 0
    - not ansible_check_mode

- name: Render inventory-derived local DNS records
  ansible.builtin.template:
    src: local-records.conf.j2
    dest: /opt/pihole/dnsmasq.d/05-homelab-local-records.conf
    owner: root
    group: root
    mode: "0644"
  register: pihole_local_records
  notify: Restart Pi-hole after local DNS changes
  when: pihole_enabled | bool

- name: Create the Pi-hole data volume
  containers.podman.podman_volume:
    name: pihole-data
    state: present
  when:
    - pihole_enabled | bool
    - podman_available | bool

- name: Run the Pi-hole container
  containers.podman.podman_container:
    name: pihole
    image: "{{ pihole_image }}"
    hostname: "{{ inventory_hostname }}"
    state: started
    restart_policy: always
    pull: missing
    env:
      TZ: "{{ pi_timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: "{{ pihole_upstream_dns | join(';') }}"
      FTLCONF_misc_etc_dnsmasq_d: "true"
    publish: >-
      {{ [
        pihole_lan_address ~ ':' ~ pihole_dns_port ~ ':53/tcp',
        pihole_lan_address ~ ':' ~ pihole_dns_port ~ ':53/udp'
      ] + ([] if pihole_tailnet_address | length == 0 else [
        pihole_tailnet_address ~ ':' ~ pihole_dns_port ~ ':53/tcp',
        pihole_tailnet_address ~ ':' ~ pihole_dns_port ~ ':53/udp'
      ]) + [
        pihole_lan_address ~ ':' ~ pi_admin_port ~ ':80/tcp'
      ] }}
    volume:
      - pihole-data:/etc/pihole
      - /opt/pihole/dnsmasq.d:/etc/dnsmasq.d:ro
    cap_add:
      - NET_ADMIN
  no_log: "{{ not pi_emulation_mode }}"
  register: pihole_container
  when:
    - pihole_enabled | bool
    - podman_available | bool

- name: Wait for the Pi-hole gravity database
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - pihole
      - test
      - -s
      - /etc/pihole/gravity.db
  register: pihole_gravity_database
  changed_when: false
  retries: 60
  delay: 2
  until: pihole_gravity_database.rc == 0
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - not ansible_check_mode

- name: Wait for the Pi-hole adlist schema
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - pihole
      - pihole-FTL
      - sqlite3
      - /etc/pihole/gravity.db
      - >-
        SELECT count(*) FROM sqlite_master
        WHERE type = 'table' AND name = 'adlist';
  register: pihole_adlist_schema
  changed_when: false
  retries: 60
  delay: 2
  until: pihole_adlist_schema.stdout | trim == '1'
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - not ansible_check_mode

- name: Reconcile the authoritative Pi-hole adlists
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - pihole
      - pihole-FTL
      - sqlite3
      - /etc/pihole/gravity.db
      - >-
        BEGIN;
        DELETE FROM adlist
        WHERE type = 0
          AND address NOT IN (
          {% for adlist in pihole_adlists %}
          '{{ adlist.address | replace("'", "''") }}'{{ ',' if not loop.last else '' }}
          {% endfor %}
          );
        {% for adlist in pihole_adlists %}
        INSERT INTO adlist (address, enabled, comment, type)
        VALUES (
          '{{ adlist.address | replace("'", "''") }}',
          1,
          '{{ adlist.comment | replace("'", "''") }}',
          0
        )
        ON CONFLICT(address, type) DO UPDATE SET
          enabled = excluded.enabled,
          comment = excluded.comment
        WHERE adlist.enabled != excluded.enabled
           OR adlist.comment != excluded.comment;
        {% endfor %}
        COMMIT;
        SELECT total_changes();
  register: pihole_adlists_reconciliation
  changed_when: pihole_adlists_reconciliation.stdout | trim | int > 0
  notify: Update Pi-hole gravity after adlist changes
  when:
    - pihole_enabled | bool
    - podman_available | bool
    - not ansible_check_mode

- name: Apply Pi-hole adlist changes before runtime verification
  ansible.builtin.meta: flush_handlers

- name: Wait for Pi-hole DNS
  ansible.builtin.wait_for:
    host: "{{ pihole_lan_address }}"
    port: "{{ pihole_dns_port }}"
    timeout: 120
  when:
    - pihole_enabled | bool
    - not ansible_check_mode

- name: Report Pi-hole convergence
  ansible.builtin.debug:
    msg: >-
      {% if not podman_available %}
      Pi-hole runtime checks skipped because Podman is unavailable;
      local records changed={{ pihole_local_records.changed }}.
      {% elif ansible_check_mode %}
      Pi-hole runtime would converge in deployment;
      local records changed={{ pihole_local_records.changed }}.
      {% else %}
      Pi-hole container changed={{ pihole_container.changed }};
      local records changed={{ pihole_local_records.changed }}.
      {% endif %}
  when: pihole_enabled | bool
