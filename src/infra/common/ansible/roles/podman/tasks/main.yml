---
- name: Install Podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect the installed Podman runtime
  ansible.builtin.command: podman --version
  check_mode: false
  changed_when: false
  failed_when: false
  register: podman_runtime

- name: Record Podman runtime availability
  ansible.builtin.set_fact:
    podman_available: "{{ podman_runtime.rc == 0 }}"

- name: Enable restart-policy restoration at boot
  ansible.builtin.systemd_service:
    name: podman-restart.service
    enabled: true
  when: podman_available | bool
