name: flake check

# Static checks and closure builds run without deployment credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual reruns when investigating CI flakes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-product:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/status
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: install pinned status dependencies
        run: bun install --frozen-lockfile

      - name: typecheck and test status product
        run: bun run check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          # Authenticate to GitHub for flake inputs that come from
          # github: URLs (avoids unauthenticated rate limits).
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: fast Nix checks
        # HOMELAB_CI=1 + --impure activate the CI-only davinci-resolve stub
        # (infra/workstation/default.nix): the unfree, uncached
        # multi-GB binary repackage would otherwise rebuild every run (~40 min,
        # and it SIGTERM'd a run at the runner's disk/time limit on 2026-07-18).
        # Local `just rebuild` / `nix flake check` stay pure → real package.
        run: HOMELAB_CI=1 nix develop --impure --command bash scripts/check-nix.sh fast --impure

  nix-vms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: disposable NixOS runtime checks
        run: HOMELAB_CI=1 nix develop --impure --command bash scripts/check-nix.sh vm --impure

  pi-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Pi lint, contracts, inventory, and Ansible syntax
        # Root flake.lock pins devenv; infra/pi/devenv.lock pins the appliance tools.
        run: nix develop --command just pi::check

  # Build the converged workstation closure on the standard x86 runner. This
  # job only proves the closure: it receives no deployment credentials and
  # never activates a host.
  workstation-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: build workstation system closure
        id: closure
        run: |
          path="$(
            HOMELAB_CI=1 nix build --impure \
              .#nixosConfigurations.workstation.config.system.build.toplevel \
              --no-link \
              --print-out-paths \
              --print-build-logs \
              --option max-jobs 1 \
              --option cores 2
          )"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
