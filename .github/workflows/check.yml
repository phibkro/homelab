name: flake check

# Runs `nix flake check` on every push to main and on every pull
# request. Closes the gap that `.githooks/pre-commit` skips on Macs
# without nix on PATH (which is most commits, since the working tree
# lives on a Mac and nix runs on the host). Anything that bypasses
# pre-commit gets caught here before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual reruns when investigating CI flakes.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          # Authenticate to GitHub for flake inputs that come from
          # github: URLs (avoids unauthenticated rate limits).
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      # Public runners cannot resolve the operator-local pagu-box checkout or
      # private tonic repository. Preserve full configuration evaluation by
      # substituting pagu-box's public flake and tonic's checked-in package-
      # contract fixture; local checks and deployments still use both real
      # checkouts from flake.lock.
      - name: nix flake check
        run: |
          nix flake check --print-build-logs \
            --override-input pagu-box github:phibkro/pagu-box \
            --override-input tonic path:./.github/fixtures/tonic
