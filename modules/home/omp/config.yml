modelRoles:
  default: opencode-go/muse-spark-1.2-contributor
  smol: opencode-go/muse-spark-1.2-contributor
  slow: opencode-go/muse-spark-1.2-contributor
  plan: opencode-go/muse-spark-1.2-contributor
  designer: opencode-go/muse-spark-1.2-contributor
  commit: opencode-go/muse-spark-1.2-contributor
  tiny: opencode-go/muse-spark-1.2-contributor
  task: opencode-go/muse-spark-1.2-contributor
  advisor: opencode-go/muse-spark-1.2-contributor
  # vision remains unset because Muse Spark is text-only; retain OMP's image-capable vision role.
modelProviderOrder:
  - openai-codex
  - anthropic

providers:
  webSearchOrder:
    - exa

cycleOrder:
  - smol
  - default
  - slow

theme:
  dark: dark-catppuccin
  light: light-catppuccin

defaultThinkingLevel: auto

retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-luna
      - opencode-go/deepseek-v4-flash
    smol:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-flash
    slow:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-flash
    plan:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-flash
    designer:
      - openai-codex/gpt-5.6-luna
      - opencode-go/deepseek-v4-flash
    commit:
      - openai-codex/gpt-5.6-luna
      - opencode-go/deepseek-v4-flash
    tiny:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-flash
    task:
      - openai-codex/gpt-5.6-luna:max
      - opencode-go/deepseek-v4-flash
    advisor:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-flash

interruptMode: wait

advisor:
  enabled: false
  subagents: false

task:
  eager: preferred
  batch: true
  enableEffort: true
  maxConcurrency: 3
  maxRecursionDepth: 2
  maxEffort: max
  isolation:
    mode: auto
    apply: false

bash:
  autoBackground:
    enabled: true
    thresholdMs: 60000

ask:
  notify: on

eval:
  py: false
  js: true

debug:
  enabled: true

compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true

memory:
  backend: mnemopi

secrets:
  enabled: true

startup:
  setupWizard: false
  showSplash: false

dev:
  autoqaConsent: granted
