modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:high
  slow: opencode-go/glm-5.3-flash
  designer: opencode-go/glm-5.3-flash
  tiny: openai-codex/gpt-5.6-luna:high
  advisor: opencode-go/glm-5.3-flash
modelProviderOrder:
  - openai-codex
  - anthropic

providers:
  webSearchOrder:
    - exa

cycleOrder:
  - smol
  - default
  - slow

theme:
  dark: dark-catppuccin
  light: light-catppuccin

defaultThinkingLevel: auto

retry:
  fallbackChains:
    opencode-go/glm-5.3-flash:
      - openai-codex/gpt-5.6-sol
    openai-codex/gpt-5.6-sol:
      - opencode-go/glm-5.3-flash
    openai-codex/gpt-5.6-luna:
      - opencode-go/glm-5.3-flash

interruptMode: wait

advisor:
  enabled: false
  subagents: false

task:
  eager: preferred
  batch: true
  enableEffort: true
  maxConcurrency: 3
  maxRecursionDepth: 2
  maxEffort: max
  isolation:
    mode: auto
    apply: false

bash:
  autoBackground:
    enabled: true
    thresholdMs: 60000

ask:
  notify: on

eval:
  py: false
  js: true

debug:
  enabled: true

compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true

memory:
  backend: mnemopi

secrets:
  enabled: true

startup:
  setupWizard: false
  showSplash: false

dev:
  autoqaConsent: granted
