---
all:
  children:
    pi_appliances:
      hosts:
        pi-emulated:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: "{{ lookup('env', 'PI_VM_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          pi_emulation_mode: true
          pi_lan_address: 10.0.2.15
          pi_lan_cidr: 10.0.2.0/24
          pi_service_bind_address: 10.0.2.15
          pihole_lan_address: 10.0.2.15
          pihole_tailnet_address: ""
          pi_admin_port: 8081
          pi_dns_port: 53
          pi_domain: home.test
          pi_deprecated_domains: []
          pi_routes:
            - name: pihole
              hostname: pihole.home.test
              upstream_address: 10.0.2.15
              upstream_port: 8081
              scheme: http
              reachability: internal
              audience: operator
              auth: none
              forward_auth_exempt_paths: []
              forward_auth_upstream: null
              oidc_redirect_path: null
              upstream_host_header: null
              upstream_origin_header: null
          pi_tailnet_workload_ports: []
          authelia_oidc_clients: []
          ddns_hostnames: []
          gatus_endpoints:
            - name: pihole-dns
              url: tcp://10.0.2.15:53
              interval: 60s
              conditions: ["[CONNECTED] == true"]
              failure_threshold: 3
              send_on_resolved: true
            - name: pihole-admin
              url: http://10.0.2.15:8081/admin/
              interval: 60s
              conditions: ["[STATUS] == 200"]
              failure_threshold: 3
              send_on_resolved: true
          victoriametrics_scrape_jobs: []
          pihole_local_dns_records:
            - address: 10.0.2.15
              names: [pi.home.test, pihole.home.test]
          pi_backup_target_address: 100.81.5.122
          authelia_log_level: debug
          tailscale_apt_suite: bookworm
          # DDNS mutates external Cloudflare records and is intentionally
          # excluded from the disposable guest. All appliance-local roles
          # remain enabled and receive safe-shaped credentials from
          # scripts/test-vm.sh.
          ddns_enabled: false
          # Never emit a synthetic liveness ping to an external service from
          # the disposable guest; the role's helper has an offline contract.
          heartbeat_enabled: false
          # Glance deployment needs network access to pull its release image.
          # The generator contract covers enabled production inputs.
          glance_enabled: false
          # One job exercises the complete backup runner/service/timer path.
          # Production's full manifest remains covered by role contracts.
          pi_backup_jobs:
            - name: pihole
              paths:
                - /var/lib/containers/storage/volumes/pihole-data/_data
                - /opt/pihole/dnsmasq.d/05-homelab-local-records.conf
