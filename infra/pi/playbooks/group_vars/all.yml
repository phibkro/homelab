---
pi_timezone: Europe/Oslo
pi_hostname: pi
pi_disable_disk_swap: true
pi_volatile_journal: true
pi_emulation_mode: false
pi_lan_cidr: 192.168.1.0/24
pi_tailnet_interface: tailscale0
pi_container_bridge_interface: podman0
tailscale_install: true
tailscale_enroll: false
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
tailscale_hostname: pi
tailscale_advertise_routes:
  - 192.168.1.0/24
tailscale_advertise_exit_node: true
tailscale_accept_dns: false
tailscale_apt_suite: trixie
tailscale_apt_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39

pihole_image: >-
  docker.io/pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
pihole_web_password: "{{ lookup('env', 'PIHOLE_WEB_PASSWORD') }}"
pihole_upstream_dns:
  - 1.1.1.1
  - 9.9.9.9

caddy_enabled: true
caddy_http_port: 80
caddy_https_port: 443
caddy_tls_mode: "{{ 'internal' if pi_emulation_mode else 'cloudflare' }}"
caddy_acme_email: philib.krogh@gmail.com
caddy_cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_ACME_TOKEN') }}"
caddy_builder_image: >-
  docker.io/library/caddy:2.10.2-builder-alpine@sha256:4cff3ae272ea05842adb4546e35961e4947aeea65f80fa1eb62a35b960e84971
caddy_runtime_image: >-
  docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
caddy_cloudflare_plugin: github.com/caddy-dns/cloudflare@v0.2.4
caddy_build_custom_image: "{{ not pi_emulation_mode }}"
caddy_image: >-
  {{ 'localhost/homelab-caddy:2.10.2-cloudflare-0.2.4'
     if caddy_build_custom_image else caddy_runtime_image }}

# Appliance identity and access plane. Secret values are injected by
# SecretSpec into the environment at execution time; no plaintext belongs in
# inventory or Git.
authelia_jwt_secret: "{{ lookup('env', 'AUTHELIA_JWT_SECRET') }}"
authelia_session_secret: "{{ lookup('env', 'AUTHELIA_SESSION_SECRET') }}"
authelia_storage_encryption_key: "{{ lookup('env', 'AUTHELIA_STORAGE_ENCRYPTION_KEY') }}"
authelia_oidc_hmac_secret: "{{ lookup('env', 'AUTHELIA_OIDC_HMAC_SECRET') }}"
authelia_oidc_issuer_private_key: "{{ lookup('env', 'AUTHELIA_OIDC_ISSUER_PRIVATE_KEY') }}"
authelia_users_database: "{{ lookup('env', 'AUTHELIA_USERS_DATABASE') }}"
authelia_oidc_client_secret_hashes:
  metrics: "{{ lookup('env', 'OIDC_METRICS_CLIENT_SECRET_HASH') }}"
  photos: "{{ lookup('env', 'OIDC_PHOTOS_CLIENT_SECRET_HASH') }}"
  news: "{{ lookup('env', 'OIDC_NEWS_CLIENT_SECRET_HASH') }}"
  vault: "{{ lookup('env', 'OIDC_VAULT_CLIENT_SECRET_HASH') }}"

# Dynamic public records are generated from the inventory's internet routes.
ddns_enabled: true
# Cloudflare's authoritative zone is the parent of the private service
# namespace. Keep these explicit: pi_domain is not a Cloudflare zone ID.
ddns_zone_name: phibkro.org
ddns_api_token: "{{ lookup('env', 'CLOUDFLARE_DDNS_API_TOKEN') }}"

# ntfy is provisioned before Gatus so host-local alert producers can use its
# authenticated route; Gatus itself remains on the off-host public route.
ntfy_publisher_token: "{{ lookup('env', 'NTFY_PUBLISHER_TOKEN') }}"
ntfy_publisher_password_hash: "{{ lookup('env', 'NTFY_PUBLISHER_PASSWORD_HASH') }}"
ntfy_agents_channel: "{{ lookup('env', 'NTFY_AGENTS_CHANNEL') }}"
ntfy_alert_routes:
  operator:
    url: https://ntfy.sh
    topic: "{{ lookup('env', 'NTFY_OPERATOR_TOPIC') }}"
    topic_file: "{{ ntfy_operator_topic_file }}"
    token_file: ""
  agents:
    url: "{{ ntfy_alert_url }}"
    topic: "{{ ntfy_agents_channel }}"
    topic_file: "{{ ntfy_agents_topic_file }}"
    token_file: "{{ ntfy_publisher_token_file }}"

# Beszel agent trust material is the hub's SSH public key. It is not a
# credential, but SecretSpec remains the single deployment-input boundary.
beszel_agent_public_key: "{{ lookup('env', 'BESZEL_AGENT_PUBLIC_KEY') }}"
# A deployment-only Beszel superuser reconciles inventory-derived system
# records. SecretSpec injects its password only during plan/deploy. The
# managed hub container does not retain it in configuration or environment.
beszel_superuser_email: "{{ lookup('env', 'BESZEL_SUPERUSER_EMAIL') }}"
beszel_superuser_password: "{{ lookup('env', 'BESZEL_SUPERUSER_PASSWORD') }}"
heartbeat_url: "{{ lookup('env', 'HEARTBEAT_PI_URL') }}"

# Gatus is the appliance/operator monitor, so its failure notifications stay
# on the off-host ntfy.sh route and remain available during a local ntfy outage.
gatus_ntfy_channel: "{{ ntfy_alert_routes.operator.topic }}"
gatus_ntfy_url: https://ntfy.sh
# A local ntfy token must never be sent to ntfy.sh. Set this path only when
# gatus_ntfy_url is changed to the authenticated local HTTP endpoint.
gatus_ntfy_token_path: ""
vector_victorialogs_endpoint: >-
  http://{{ pi_service_bind_address }}:{{ victorialogs_bind_port }}/insert/elasticsearch/

# Every job is a narrow, explicit state manifest. The backup role rejects
# paths outside its immutable allowlist and never infers additional paths.
pi_backup_restic_password: "{{ lookup('env', 'RESTIC_PASSWORD') }}"
pi_backup_ssh_private_key: "{{ lookup('env', 'RESTIC_SSH_PRIVATE_KEY') }}"
# Backup jobs are generated from inventory/backup.nix.

# Diagnostic listeners are explicit here. Workload ports with
# `exposeOnTailnet = true` are generated from the inventory endpoint contract.
# All services bind `pi_lan_address`; public HTTP remains limited to Caddy.
pi_tailnet_tcp_ports: >-
  {{
    (
      [
        gatus_port,
        beszel_bind_port,
        beszel_agent_listen_port,
        victoriametrics_bind_port,
        victorialogs_bind_port
      ]
      + pi_tailnet_workload_ports
    )
    | map('int')
    | unique
    | list
  }}
