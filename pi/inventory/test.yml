---
all:
  children:
    pi_appliances:
      hosts:
        pi-emulated:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: "{{ lookup('env', 'PI_VM_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          pi_emulation_mode: true
          pi_lan_address: 10.0.2.15
          pi_lan_cidr: 10.0.2.0/24
          pi_service_bind_address: 10.0.2.15
          pi_backup_aurora_address: 100.101.67.111
          authelia_log_level: debug
          tailscale_apt_suite: bookworm
          # DDNS mutates external Cloudflare records and is intentionally
          # excluded from the disposable guest. All appliance-local roles
          # remain enabled and receive safe-shaped credentials from
          # scripts/test-vm.sh.
          ddns_enabled: false
          # Never emit a synthetic liveness ping to an external service from
          # the disposable guest; the role's helper has an offline contract.
          heartbeat_enabled: false
          # One job exercises the complete backup runner/service/timer path.
          # Production's full manifest remains covered by role contracts.
          pi_backup_jobs:
            - name: pihole
              paths:
                - /var/lib/containers/storage/volumes/pihole-data/_data
                - /opt/pihole/dnsmasq.d/05-homelab-local-records.conf
