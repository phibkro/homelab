---
all:
  children:
    pi_appliances:
      hosts:
        pi-emulated:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: "{{ lookup('env', 'PI_VM_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          pi_emulation_mode: true
          pi_lan_address: 10.0.2.15
          pi_lan_cidr: 10.0.2.0/24
          pi_service_bind_address: 10.0.2.15
