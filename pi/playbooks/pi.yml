---
- name: Converge the Pi entry appliance
  hosts: pi_appliances
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate the supported operating-system family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: >-
          Plan B supports Raspberry Pi OS or Debian only; found
          {{ ansible_facts.distribution }}.

    - name: Require an ARM64 production target
      ansible.builtin.assert:
        that:
          - pi_emulation_mode | bool or ansible_facts.architecture in ['aarch64', 'arm64']
        fail_msg: >-
          Production target must be ARM64; set pi_emulation_mode only in the
          disposable test inventory.

    - name: Require a Pi-hole web password
      ansible.builtin.assert:
        that:
          - pihole_web_password | length >= 12
        fail_msg: Set PIHOLE_WEB_PASSWORD to at least 12 characters.
      no_log: true

    - name: Require the production ACME credential
      ansible.builtin.assert:
        that:
          - caddy_cloudflare_api_token | length >= 20
        fail_msg: Set CLOUDFLARE_ACME_TOKEN before deploying production HTTPS.
      no_log: true
      when:
        - caddy_enabled | bool
        - caddy_tls_mode == 'cloudflare'

    - name: Validate the appliance route contract
      ansible.builtin.assert:
        that:
          - pi_routes | length > 0
          - pi_routes | map(attribute='name') | unique | length == pi_routes | length
          - pi_routes | map(attribute='hostname') | unique | length == pi_routes | length
          - >-
            (
              pi_routes | map(attribute='upstream_address')
              | zip(pi_routes | map(attribute='upstream_port'))
              | map('join', ':') | unique | list | length
            ) == (pi_routes | length)
          - pi_routes | map(attribute='reachability') | difference(['internal', 'internet']) | length == 0
        fail_msg: Appliance routes require unique names, hostnames, and backend address-port sockets.

    - name: Reject wildcard production service bindings
      ansible.builtin.assert:
        that:
          - pi_emulation_mode | bool or pi_service_bind_address != '0.0.0.0'
        fail_msg: Production services must bind to the inventory-declared LAN address.

    - name: Validate the explicit tailnet diagnostic port list
      ansible.builtin.assert:
        that:
          - item is number or (item is string and item is match('^[0-9]+$'))
          - item | int >= 1
          - item | int <= 65535
        fail_msg: Tailnet diagnostic ports must be numeric TCP ports from 1 through 65535.
      loop: "{{ pi_tailnet_tcp_ports | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: Require unique tailnet diagnostic ports
      ansible.builtin.assert:
        that:
          - >-
            (pi_tailnet_tcp_ports | default([]) | map('int') | list | unique | length)
            == (pi_tailnet_tcp_ports | default([]) | length)
        fail_msg: Tailnet diagnostic ports must be unique.

    - name: Require subnet-bound services for diagnostic exposure
      ansible.builtin.assert:
        that:
          - >-
            (pi_tailnet_tcp_ports | default([]) | length == 0)
            or pi_service_bind_address == pi_lan_address
        fail_msg: >-
          Tailnet diagnostic ports are subnet-reachable listeners; services
          must bind the declared LAN address rather than a wildcard or an
          unrelated interface.

  roles:
    - role: base
    - role: firewall
    - role: tailscale
    - role: podman
    - role: pihole
    - role: authelia
    - role: ddns
    - role: ntfy
    - role: victorialogs
    - role: vector
    - role: victoriametrics
    - role: beszel
    - role: beszel_agent
    - role: gatus
    - role: heartbeat
    - role: backup
    - role: caddy
