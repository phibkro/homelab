[project]
name = "homelab-pi"
revision = "1.0"

[providers]
keyring = "keyring://"
env = "env://"

[profiles.production.defaults]
providers = ["keyring", "env"]

[profiles.production]
PIHOLE_WEB_PASSWORD = { description = "Pi-hole production administrator password", required = true }
TAILSCALE_AUTH_KEY = { description = "Ephemeral Tailscale enrollment key", required = false }
CLOUDFLARE_ACME_TOKEN = { description = "Cloudflare DNS edit token for Caddy ACME DNS-01", required = true }
CLOUDFLARE_DDNS_API_TOKEN = { description = "Cloudflare DNS edit token for managed public A records", required = true }

AUTHELIA_JWT_SECRET = { description = "Authelia password-reset JWT secret", required = true }
AUTHELIA_SESSION_SECRET = { description = "Authelia browser-session secret", required = true }
AUTHELIA_STORAGE_ENCRYPTION_KEY = { description = "Authelia storage encryption key", required = true }
AUTHELIA_OIDC_HMAC_SECRET = { description = "Authelia OIDC HMAC secret", required = true }
AUTHELIA_OIDC_ISSUER_PRIVATE_KEY = { description = "Authelia OIDC issuer private key", required = true }
AUTHELIA_USERS_DATABASE = { description = "Authelia users database YAML", required = true }
OIDC_METRICS_CLIENT_SECRET_HASH = { description = "PBKDF2 hash for the Beszel OIDC client", required = true }
OIDC_PHOTOS_CLIENT_SECRET_HASH = { description = "PBKDF2 hash for the Immich OIDC client", required = true }
OIDC_NEWS_CLIENT_SECRET_HASH = { description = "PBKDF2 hash for the Miniflux OIDC client", required = true }
OIDC_VAULT_CLIENT_SECRET_HASH = { description = "PBKDF2 hash for the Vaultwarden OIDC client", required = true }

NTFY_PUBLISHER_TOKEN = { description = "Local ntfy publisher bearer token", required = true }
NTFY_PUBLISHER_PASSWORD_HASH = { description = "Bcrypt hash for the local ntfy publisher", required = true }
NTFY_AGENTS_CHANNEL = { description = "Private ntfy topic for agent alerts", required = true }
NTFY_OPERATOR_TOPIC = { description = "Public ntfy topic for operator alerts", required = true }

RESTIC_PASSWORD = { description = "Pi restic repository password", required = true }
RESTIC_SSH_PRIVATE_KEY = { description = "SSH private key for the Aurora restic target", required = true }
