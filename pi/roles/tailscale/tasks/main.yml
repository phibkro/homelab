---
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tailscale_install | bool

- name: Install the pinned Tailscale repository key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "sha256:{{ tailscale_apt_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: tailscale_install | bool

- name: Configure the Tailscale stable repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types:
      - deb
    uris:
      - https://pkgs.tailscale.com/stable/debian
    suites:
      - bookworm
    components:
      - main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    enabled: true
    state: present
  when: tailscale_install | bool

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: tailscale_install | bool

- name: Enable the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  when: tailscale_install | bool

- name: Enable IPv4 and IPv6 forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Inspect Tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: tailscale_install | bool

- name: Require an enrollment key when enrollment is requested
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length >= 20
    fail_msg: Set TAILSCALE_AUTH_KEY before requesting enrollment.
  no_log: true
  when: tailscale_enroll | bool

- name: Enroll the appliance into the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ tailscale_auth_key }}"
      - "--hostname={{ tailscale_hostname }}"
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--advertise-exit-node={{ tailscale_advertise_exit_node | ternary('true', 'false') }}"
      - "--accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
      - "--ssh=false"
  no_log: true
  changed_when: true
  when:
    - tailscale_enroll | bool
    - tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != 'Running'

- name: Reconcile tailnet routing preferences
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--hostname={{ tailscale_hostname }}"
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--advertise-exit-node={{ tailscale_advertise_exit_node | ternary('true', 'false') }}"
      - "--accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
      - "--ssh=false"
  changed_when: false
  when:
    - tailscale_enroll | bool
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
