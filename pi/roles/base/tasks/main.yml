---
- name: Install the appliance operating baseline
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-apt
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the appliance timezone
  community.general.timezone:
    name: "{{ pi_timezone }}"

- name: Set the appliance hostname
  ansible.builtin.hostname:
    name: "{{ pi_hostname }}"
    use: systemd

- name: Keep the appliance hostname locally resolvable
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ pi_hostname }}"
    owner: root
    group: root
    mode: "0644"

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: pi_volatile_journal | bool

- name: Configure flash-friendly journald
  ansible.builtin.template:
    src: journald-volatile.conf.j2
    dest: /etc/systemd/journald.conf.d/20-appliance-storage.conf
    owner: root
    group: root
    mode: "0644"
  when: pi_volatile_journal | bool
  notify: Restart journald

- name: Inspect active swap devices
  ansible.builtin.command:
    argv:
      - swapon
      - --show=NAME
      - --noheadings
      - --raw
  register: base_active_swap_devices
  changed_when: false
  check_mode: false
  when: pi_disable_disk_swap | bool

- name: Disable configured disk swap
  ansible.builtin.command:
    argv:
      - swapoff
      - "{{ item }}"
  loop: >-
    {{ base_active_swap_devices.stdout_lines
       | default([])
       | reject('match', '^/dev/zram')
       | list }}
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when: pi_disable_disk_swap | bool

- name: Prevent disk swap activation from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# disabled by Ansible Plan B: \1'
  when: pi_disable_disk_swap | bool
