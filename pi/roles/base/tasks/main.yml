---
- name: Install the appliance operating baseline
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-apt
      - python3-debian
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the appliance timezone
  community.general.timezone:
    name: "{{ pi_timezone }}"

- name: Set the appliance hostname
  ansible.builtin.hostname:
    name: "{{ pi_hostname }}"
    use: systemd

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: pi_volatile_journal | bool

- name: Configure flash-friendly journald
  ansible.builtin.template:
    src: journald-volatile.conf.j2
    dest: /etc/systemd/journald.conf.d/20-appliance-storage.conf
    owner: root
    group: root
    mode: "0644"
  when: pi_volatile_journal | bool
  notify: Restart journald

- name: Disable configured disk swap
  ansible.builtin.command: swapoff --all
  when:
    - pi_disable_disk_swap | bool
    - ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Prevent disk swap activation from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# disabled by Ansible Plan B: \1'
  when: pi_disable_disk_swap | bool
