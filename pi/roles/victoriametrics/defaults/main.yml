---
# VictoriaMetrics publishes a multi-platform immutable index. Keeping the
# digest here prevents a mutable tag from changing the appliance runtime.
victoriametrics_enabled: true
victoriametrics_image_digest: sha256:54467c7764a3e6579199af1914bb779f01ce32265cd552eb5ae0d4f8a2b80a97
victoriametrics_image: "docker.io/victoriametrics/victoria-metrics:v1.150.0@{{ victoriametrics_image_digest }}"
victoriametrics_bind_address: "{{ pi_service_bind_address }}"
victoriametrics_bind_port: 8428
victoriametrics_health_address: "{{ victoriametrics_bind_address }}"
victoriametrics_data_dir: /var/lib/victoriametrics
victoriametrics_config_dir: /etc/victoriametrics
victoriametrics_container_user: "65532:65532"
victoriametrics_retention_period: 14d
# Supplied by the inventory/integration layer; no implicit producer targets.
victoriametrics_scrape_jobs: []
