---
# Plan B backup role.  The caller must provide the complete, explicit state
# manifest in pi_backup_jobs; this role deliberately has no guessed paths.
# The pi_backup_* names are the playbook's public boundary contract; each
# declaration carries a narrow no-role-prefix exemption for that reason.
pi_backup_enabled: true # noqa: var-naming[no-role-prefix]
pi_backup_jobs: [] # noqa: var-naming[no-role-prefix]

pi_backup_aurora_host: aurora.saola-matrix.ts.net # noqa: var-naming[no-role-prefix]
pi_backup_aurora_address: "" # noqa: var-naming[no-role-prefix]
pi_backup_aurora_user: restic # noqa: var-naming[no-role-prefix]
pi_backup_repository_prefix: "/pi" # noqa: var-naming[no-role-prefix]
pi_backup_aurora_known_host: "{{ pi_backup_pinned_aurora_known_host }}" # noqa: var-naming[no-role-prefix]

# SecretSpec supplies these values at execution time.  They are never
# rendered into a unit or command line; only root-readable files receive
# them.
pi_backup_restic_password: "{{ lookup('env', 'RESTIC_PASSWORD') }}" # noqa: var-naming[no-role-prefix]
pi_backup_ssh_private_key: "{{ lookup('env', 'RESTIC_SSH_PRIVATE_KEY') }}" # noqa: var-naming[no-role-prefix]
pi_backup_secret_dir: /etc/restic # noqa: var-naming[no-role-prefix]
pi_backup_password_file: /etc/restic/pi-password # noqa: var-naming[no-role-prefix]
pi_backup_ssh_key_file: /etc/restic/aurora_ssh_key # noqa: var-naming[no-role-prefix]
pi_backup_known_hosts_file: /etc/restic/aurora_known_hosts # noqa: var-naming[no-role-prefix]

pi_backup_state_dir: /var/lib/pi-restic # noqa: var-naming[no-role-prefix]
pi_backup_cache_dir: /var/cache/pi-restic # noqa: var-naming[no-role-prefix]
pi_backup_restore_dir: /var/lib/pi-restic-restore # noqa: var-naming[no-role-prefix]
pi_backup_max_age_hours: 36 # noqa: var-naming[no-role-prefix]
pi_backup_randomized_delay: 15m # noqa: var-naming[no-role-prefix]

pi_backup_default_schedule: "*-*-* 03:15:00" # noqa: var-naming[no-role-prefix]
pi_backup_default_keep_daily: 7 # noqa: var-naming[no-role-prefix]
pi_backup_default_keep_weekly: 4 # noqa: var-naming[no-role-prefix]
pi_backup_default_keep_monthly: 12 # noqa: var-naming[no-role-prefix]
pi_backup_default_keep_yearly: 0 # noqa: var-naming[no-role-prefix]
pi_backup_prune_schedule: "*-*-01 04:30:00" # noqa: var-naming[no-role-prefix]
pi_backup_metadata_check_schedule: "Sun *-*-* 05:30:00" # noqa: var-naming[no-role-prefix]
pi_backup_data_check_schedule: "*-*-01 06:00:00" # noqa: var-naming[no-role-prefix]

# Backing up Tailscale's node identity is sensitive and opt-in.  Enabling it
# without an explicit path manifest is an error; the role never infers this
# path or adds it to another job automatically.
pi_backup_tailscale_identity_enabled: false # noqa: var-naming[no-role-prefix]
pi_backup_tailscale_identity_paths: [] # noqa: var-naming[no-role-prefix]
pi_backup_tailscale_identity_job_name: tailscale-identity # noqa: var-naming[no-role-prefix]
