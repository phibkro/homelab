---
- name: Install the Pi backup client and SFTP transport
  ansible.builtin.apt:
    name:
      - restic
      - openssh-client
    state: present
    update_cache: false
  when: pi_backup_enabled | bool

- name: Assemble the explicit Pi backup manifest
  ansible.builtin.set_fact:
    pi_backup_effective_jobs: >- # noqa: var-naming[no-role-prefix] - public Pi backup namespace
      {{ pi_backup_jobs + ([{
        'name': pi_backup_tailscale_identity_job_name,
        'paths': pi_backup_tailscale_identity_paths
      }] if pi_backup_tailscale_identity_enabled | bool else []) }}
    pi_backup_effective_source_prefixes: >- # noqa: var-naming[no-role-prefix] - public Pi backup namespace
      {{ pi_backup_approved_source_prefixes
         + (['/var/lib/tailscale/tailscaled.state']
            if pi_backup_tailscale_identity_enabled | bool else []) }}
  changed_when: false

- name: Validate the explicit Pi backup contract
  ansible.builtin.assert:
    that:
      - pi_backup_effective_jobs | length > 0
      - pi_backup_approved_source_prefixes | length > 0
      - pi_backup_restic_password | length >= 20
      - pi_backup_ssh_private_key | length > 0
      - pi_backup_aurora_host == 'aurora.saola-matrix.ts.net'
      - pi_backup_aurora_address is match('^[0-9]+(?:\.[0-9]+){3}$')
      - pi_backup_aurora_user == 'restic'
      - pi_backup_repository_prefix == '/pi'
      - pi_backup_max_age_hours | int > 0
      - pi_backup_aurora_known_host == pi_backup_pinned_aurora_known_host
      - >-
        pi_backup_aurora_known_host == 'aurora.saola-matrix.ts.net ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAIKnfMYRv1a3CGvnL0e82w/Z1RK7aOqS3k8JvMYbD8NET'
    fail_msg: >-
      Pi backups require an explicit state manifest, SecretSpec credentials,
      and the pinned Aurora SFTP destination contract.
  no_log: true
  when: pi_backup_enabled | bool

- name: Validate every Pi backup job and its exact paths
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - item.name is defined
      - item.paths is defined
      - item.paths is sequence
      - item.paths is not string
      - item.paths | length > 0
      - item.paths | select('match', '^/') | list | length == item.paths | length
      - >-
        item.paths | select('in',
        ['/','/var','/var/lib','/var/lib/containers','/home','/srv','/srv/share'])
        | list | length == 0
      - item.paths | select('search', '[*?]') | list | length == 0
      - item.paths | select('search', '^/(root|etc/restic|run/secrets)(/|$)') | list | length == 0
      - item.paths | select('in', ['/var/lib/containers','/var/lib/containerd','/var/lib/podman']) | list | length == 0
      - item.paths | select('search', '(^|/)\\.\\.(/|$)') | list | length == 0
      - (item.excludes | default([])) | select('match', '^/') | list | length == (item.excludes | default([]) | length)
      - (item.excludes | default([])) | select('search', '[*?]') | list | length == 0
      - item.schedule | default(pi_backup_default_schedule) | length > 0
      - item.schedule | default(pi_backup_default_schedule) is not search('[\\r\\n]')
    fail_msg: >-
      Each Pi backup job needs a safe name and a non-empty list of concrete
      state paths. Whole filesystem/container roots and globs are forbidden.
  loop: "{{ pi_backup_effective_jobs }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when: pi_backup_enabled | bool

- name: Validate every manifest path is explicitly approved
  ansible.builtin.assert:
    that:
      - item in pi_backup_effective_source_prefixes
    fail_msg: >-
      Backup path {{ item }} is not one of the immutable approved Pi state paths.
  loop: "{{ pi_backup_effective_jobs | map(attribute='paths') | flatten }}"
  loop_control:
    label: "{{ item }}"
  when: pi_backup_enabled | bool

- name: Reject duplicate Pi backup job names
  ansible.builtin.assert:
    that:
      - (pi_backup_jobs | map(attribute='name') | list | unique | length) == (pi_backup_jobs | length)
    fail_msg: Pi backup job names must be unique because they become systemd and repository names.
  when: pi_backup_enabled | bool

- name: Validate the explicit Tailscale identity opt-in
  ansible.builtin.assert:
    that:
      - (pi_backup_tailscale_identity_enabled | bool) or (pi_backup_tailscale_identity_paths | length == 0)
      - >-
        (not (pi_backup_tailscale_identity_enabled | bool))
        or (pi_backup_tailscale_identity_paths == pi_backup_tailscale_identity_approved_paths)
      - >-
        (not (pi_backup_tailscale_identity_enabled | bool))
        or (pi_backup_tailscale_identity_job_name not in
        (pi_backup_jobs | map(attribute='name') | list))
      - >-
        pi_backup_tailscale_identity_paths | select('match', '^/') | list
        | length == pi_backup_tailscale_identity_paths | length
      - pi_backup_tailscale_identity_paths | select('search', '[*?]') | list | length == 0
    fail_msg: Tailscale identity backup is opt-in and requires explicit absolute paths.
  when: pi_backup_enabled | bool

- name: Create Pi backup secret, state, cache, and restore directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pi_backup_secret_dir }}", mode: "0700" }
    - { path: "{{ pi_backup_state_dir }}", mode: "0700" }
    - { path: "{{ pi_backup_cache_dir }}", mode: "0700" }
    - { path: "{{ pi_backup_restore_dir }}", mode: "0700" }
  when: pi_backup_enabled | bool

- name: Install the root-only restic password
  ansible.builtin.copy:
    content: "{{ pi_backup_restic_password }}\n"
    dest: "{{ pi_backup_password_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: pi_backup_enabled | bool

- name: Install the root-only Aurora SSH identity
  ansible.builtin.copy:
    content: "{{ pi_backup_ssh_private_key | trim }}\n"
    dest: "{{ pi_backup_ssh_key_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: pi_backup_enabled | bool

- name: Install the pinned Aurora SSH host key
  ansible.builtin.copy:
    content: "{{ pi_backup_aurora_known_host }}\n"
    dest: "{{ pi_backup_known_hosts_file }}"
    owner: root
    group: root
    mode: "0444"
  when: pi_backup_enabled | bool

- name: Render one backup runner per explicit job
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "/usr/local/libexec/pi-restic-backup-{{ backup_job.name }}"
    owner: root
    group: root
    mode: "0750"
  loop: "{{ pi_backup_effective_jobs }}"
  loop_control:
    loop_var: backup_job
    label: "{{ backup_job.name }}"
  vars:
    job_repository: >-
      sftp:{{ pi_backup_aurora_user }}@{{ pi_backup_aurora_host }}:
      {{ pi_backup_repository_prefix }}/{{ backup_job.name }}
  notify:
    - Reload systemd after Pi backup changes
    - Restart Pi backup freshness timer
  when: pi_backup_enabled | bool

- name: Render one maintenance runner per explicit job
  ansible.builtin.template:
    src: maintenance.sh.j2
    dest: "/usr/local/libexec/pi-restic-{{ maintenance_kind }}-{{ maintenance_job.name }}"
    owner: root
    group: root
    mode: "0750"
  loop: "{{ pi_backup_effective_jobs | product(['prune', 'check-weekly', 'check-monthly']) | list }}"
  loop_control:
    loop_var: maintenance_pair
    label: "{{ maintenance_pair[1] }} {{ maintenance_pair[0].name }}"
  vars:
    maintenance_job: "{{ maintenance_pair[0] }}"
    maintenance_kind: "{{ maintenance_pair[1] }}"
    job_repository: >-
      sftp:{{ pi_backup_aurora_user }}@{{ pi_backup_aurora_host }}:
      {{ pi_backup_repository_prefix }}/{{ maintenance_job.name }}
  notify: Reload systemd after Pi backup changes
  when: pi_backup_enabled | bool

- name: Render per-job backup, prune, and check systemd units
  ansible.builtin.template:
    src: "{{ unit_template }}"
    dest: "/etc/systemd/system/pi-restic-{{ unit_kind }}-{{ unit_job.name }}.{{ unit_suffix }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pi_backup_effective_jobs | product(['backup', 'prune', 'check-weekly', 'check-monthly']) | list }}"
  loop_control:
    loop_var: unit_pair
    label: "{{ unit_pair[1] }} {{ unit_pair[0].name }}"
  vars:
    unit_job: "{{ unit_pair[0] }}"
    unit_kind: "{{ unit_pair[1] }}"
    unit_template: "{{ 'backup.service.j2' if unit_kind == 'backup' else 'maintenance.service.j2' }}"
    unit_suffix: service
  notify: Reload systemd after Pi backup changes
  when: pi_backup_enabled | bool

- name: Render per-job backup, prune, and check timers
  ansible.builtin.template:
    src: timer.j2
    dest: "/etc/systemd/system/pi-restic-{{ timer_kind }}-{{ timer_job.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pi_backup_effective_jobs | product(['backup', 'prune', 'check-weekly', 'check-monthly']) | list }}"
  loop_control:
    loop_var: timer_pair
    label: "{{ timer_pair[1] }} {{ timer_pair[0].name }}"
  vars:
    timer_job: "{{ timer_pair[0] }}"
    timer_kind: "{{ timer_pair[1] }}"
    timer_schedule: >-
      {{ timer_job.schedule | default(pi_backup_default_schedule)
         if timer_kind == 'backup'
         else pi_backup_prune_schedule if timer_kind == 'prune'
         else pi_backup_metadata_check_schedule if timer_kind == 'check-weekly'
         else pi_backup_data_check_schedule }}
  notify: Reload systemd after Pi backup changes
  when: pi_backup_enabled | bool

- name: Render the freshness checker and disposable restore helper
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: freshness.sh.j2, dest: /usr/local/libexec/pi-restic-freshness }
    - { src: restore-disposable.sh.j2, dest: /usr/local/libexec/pi-restic-restore-disposable }
  notify:
    - Reload systemd after Pi backup changes
    - Restart Pi backup freshness timer
  when: pi_backup_enabled | bool

- name: Render and enable freshness service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: freshness.service.j2, dest: /etc/systemd/system/pi-restic-freshness.service }
    - { src: freshness.timer.j2, dest: /etc/systemd/system/pi-restic-freshness.timer }
  notify: Reload systemd after Pi backup changes
  when: pi_backup_enabled | bool

- name: Initialize the expected owned Pi backup artifact list
  ansible.builtin.set_fact:
    pi_backup_expected_runtime_files: # noqa: var-naming[no-role-prefix] - public Pi backup namespace
      - /usr/local/libexec/pi-restic-freshness
      - /usr/local/libexec/pi-restic-restore-disposable
      - /etc/systemd/system/pi-restic-freshness.service
      - /etc/systemd/system/pi-restic-freshness.timer
  changed_when: false
  when: pi_backup_enabled | bool

- name: Build the expected owned Pi backup artifact list
  ansible.builtin.set_fact:
    pi_backup_expected_runtime_files: >- # noqa: var-naming[no-role-prefix] - public Pi backup namespace
      {{ pi_backup_expected_runtime_files + [
        '/usr/local/libexec/pi-restic-backup-' ~ item.name,
        '/usr/local/libexec/pi-restic-prune-' ~ item.name,
        '/usr/local/libexec/pi-restic-check-weekly-' ~ item.name,
        '/usr/local/libexec/pi-restic-check-monthly-' ~ item.name,
        '/etc/systemd/system/pi-restic-backup-' ~ item.name ~ '.service',
        '/etc/systemd/system/pi-restic-prune-' ~ item.name ~ '.service',
        '/etc/systemd/system/pi-restic-check-weekly-' ~ item.name ~ '.service',
        '/etc/systemd/system/pi-restic-check-monthly-' ~ item.name ~ '.service',
        '/etc/systemd/system/pi-restic-backup-' ~ item.name ~ '.timer',
        '/etc/systemd/system/pi-restic-prune-' ~ item.name ~ '.timer',
        '/etc/systemd/system/pi-restic-check-weekly-' ~ item.name ~ '.timer',
        '/etc/systemd/system/pi-restic-check-monthly-' ~ item.name ~ '.timer'
      ] }}
  loop: "{{ pi_backup_effective_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: pi_backup_enabled | bool

- name: Discover stale owned Pi backup artifacts
  ansible.builtin.find:
    paths:
      - /etc/systemd/system
      - /usr/local/libexec
    patterns: "pi-restic-*"
    contains: "homelab-pi-backup-role: managed"
    read_whole_file: true
    file_type: file
  register: pi_backup_stale_candidates # noqa: var-naming[no-role-prefix] - public Pi backup namespace
  changed_when: false
  when: pi_backup_enabled | bool

- name: Stop stale owned Pi backup units before removal
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  failed_when: false
  loop: "{{ pi_backup_stale_candidates.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - pi_backup_enabled | bool
    - item.path not in pi_backup_expected_runtime_files
    - item.path is search('\\.(service|timer)$')

- name: Remove stale owned Pi backup artifacts while enabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pi_backup_stale_candidates.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload systemd after Pi backup changes
  when:
    - pi_backup_enabled | bool
    - item.path not in pi_backup_expected_runtime_files

- name: Inspect initial Pi backup completion markers
  ansible.builtin.stat:
    path: "{{ pi_backup_state_dir }}/{{ item.name }}/last-success"
  loop: "{{ pi_backup_effective_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: pi_backup_initial_markers # noqa: var-naming[no-role-prefix] - public Pi backup namespace
  when:
    - pi_backup_enabled | bool
    - not ansible_check_mode

- name: Create missing initial Pi backup snapshots sequentially
  ansible.builtin.systemd_service:
    name: "pi-restic-backup-{{ item.item.name }}.service"
    state: started
    daemon_reload: true
  loop: "{{ pi_backup_initial_markers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - pi_backup_enabled | bool
    - not ansible_check_mode
    - not item.stat.exists

- name: Enable Pi backup timers
  ansible.builtin.systemd_service:
    name: "pi-restic-{{ item.1 }}-{{ item.0.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ pi_backup_effective_jobs | product(['backup', 'prune', 'check-weekly', 'check-monthly']) | list }}"
  when:
    - pi_backup_enabled | bool
    - not ansible_check_mode

- name: Enable Pi backup freshness timer
  ansible.builtin.systemd_service:
    name: pi-restic-freshness.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - pi_backup_enabled | bool
    - not ansible_check_mode

- name: Discover owned Pi backup units when disabled
  ansible.builtin.find:
    paths:
      - /etc/systemd/system
      - /usr/local/libexec
    patterns:
      - "pi-restic-*.service"
      - "pi-restic-*.timer"
      - "pi-restic-*"
    contains: "homelab-pi-backup-role: managed"
    read_whole_file: true
    file_type: file
  register: pi_backup_owned_files # noqa: var-naming[no-role-prefix] - public Pi backup namespace
  changed_when: false
  when: not pi_backup_enabled | bool

- name: Stop owned Pi backup units when disabled
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  failed_when: false
  loop: "{{ pi_backup_owned_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - not pi_backup_enabled | bool
    - not ansible_check_mode
    - item.path is search('\\.(service|timer)$')

- name: Remove owned Pi backup units and scripts when disabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pi_backup_owned_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload systemd after Pi backup changes
  when: not pi_backup_enabled | bool

# Deliberately no task removes pi_backup_repository_prefix or any remote
# repository. Disabling the role stops scheduling only; repositories remain
# available for a later recovery or re-enable.
